# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — CI/CD Deployment Workflow
#  Packages source code -> SCP to VPS -> Docker Compose Build & Launch
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  #  1. Build & Push Docker Images (Test build + optional registry backup)
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Secrets
        id: docker_auth
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
            echo "repo=$DOCKER_USER" >> "$GITHUB_OUTPUT"
            echo "✅ Docker credentials detected."
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "repo=grocery" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME and DOCKER_PASSWORD not set. Images build for test verification."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_auth.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-backend:latest
          no-cache: true

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: |
            VITE_API_URL=/api
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-frontend:latest
          no-cache: true

  # ─────────────────────────────────────────────
  #  2. Deploy to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS SSH Secrets
        id: ssh_check
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS secrets detected. Proceeding with deployment."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOST and SSH_KEY secrets are not configured in GitHub repository settings. Skipping VPS deployment."
          fi

      - name: Package Application Code
        if: steps.ssh_check.outputs.can_deploy == 'true'
        run: |
          git archive --format=tar.gz -o app.tar.gz HEAD
          ls -lh app.tar.gz

      - name: Copy Deploy Bundle to VPS
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "app.tar.gz,docker-compose.prod.yml"
          target: "/tmp"

      - name: Deploy on VPS via SSH
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            # 1. Setup target directory (handles root or non-root user)
            TARGET_DIR="/opt/grocery-shop"
            if ! mkdir -p "$TARGET_DIR" 2>/dev/null; then
              TARGET_DIR="$HOME/grocery-shop"
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            echo "📂 Deploy directory: $(pwd)"

            # 2. Unpack application bundle and docker-compose
            if [ -f /tmp/app.tar.gz ]; then
              echo "📦 Unpacking application source code..."
              tar -xzf /tmp/app.tar.gz -C "$TARGET_DIR"
              rm -f /tmp/app.tar.gz
            fi

            if [ -f /tmp/docker-compose.prod.yml ]; then
              cp -f /tmp/docker-compose.prod.yml ./docker-compose.yml
              rm -f /tmp/docker-compose.prod.yml
            fi

            # 3. Ensure Docker is installed
            if ! command -v docker &>/dev/null; then
              echo "📦 Installing Docker on VPS..."
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker 2>/dev/null || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi

            # 4. Detect compose command
            if docker compose version &>/dev/null; then
              COMPOSE="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE="docker-compose"
            else
              echo "📦 Installing Docker compose plugin..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin 2>/dev/null || true
              COMPOSE="docker compose"
            fi

            # 5. Create or fix production .env
            if [ ! -f .env ]; then
              echo "📝 Creating initial production .env..."
              printf "%s\n" \
                "NODE_ENV=production" \
                "DOCKER_USERNAME=grocery" \
                "IMAGE_TAG=latest" \
                "MONGO_ROOT_USER=admin" \
                "MONGO_ROOT_PASSWORD=columbu_secret_pwd" \
                "MONGO_DB_NAME=columbu_stores" \
                "JWT_SECRET=columbu_super_secure_jwt_secret_change_in_prod_key" \
                "JWT_EXPIRE=7d" \
                "FRONTEND_URL=http://${{ secrets.HOST }}:90" > .env
            else
              # Fix any legacy password mismatch in existing .env
              sed -i 's/columbu_secure_mongo_password_2024/columbu_secret_pwd/g' .env 2>/dev/null || true
            fi

            # 6. Build fresh containers from updated source code and launch
            echo "==> Building and starting updated containers from latest code..."
            $COMPOSE build
            $COMPOSE up -d --remove-orphans

            # 7. Ensure initial store seed data (admin, products, categories)
            echo "==> Ensuring initial database seed data..."
            sleep 10
            $COMPOSE exec -T backend node seed/seed.js || true

            echo "==> Container status:"
            $COMPOSE ps
