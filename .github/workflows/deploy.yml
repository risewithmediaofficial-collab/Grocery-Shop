# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — Simple CI/CD Deployment Workflow
#  Single-cluster deployment via Docker & SSH
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ─────────────────────────────────────────────
  #  1. Build & Push Docker Images
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Secrets
        id: docker_auth
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
            echo "repo=$DOCKER_USER" >> "$GITHUB_OUTPUT"
            echo "✅ Docker credentials detected. Images will be built and pushed to Docker Hub."
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "repo=grocery" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME and DOCKER_PASSWORD are not set in GitHub repository secrets. Images will be built to verify compilation, but will not be pushed."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_auth.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: |
            VITE_API_URL=/api
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  #  2. Deploy to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS SSH Secrets
        id: ssh_check
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS secrets detected. Proceeding with deployment."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOST and SSH_KEY secrets are not configured in GitHub repository settings. Skipping VPS deployment."
          fi

      - name: Copy docker-compose to VPS
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/tmp"

      - name: Deploy on VPS via SSH
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          script: |
            # 1. Setup target directory (handles root or non-root user)
            TARGET_DIR="/opt/grocery-shop"
            if ! mkdir -p "$TARGET_DIR" 2>/dev/null; then
              TARGET_DIR="$HOME/grocery-shop"
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            echo "📂 Deploy directory: $(pwd)"

            # 2. Copy docker-compose from /tmp
            if [ -f /tmp/docker-compose.prod.yml ]; then
              cp -f /tmp/docker-compose.prod.yml ./docker-compose.yml
              rm -f /tmp/docker-compose.prod.yml
            fi

            # 3. Ensure Docker is installed
            if ! command -v docker &>/dev/null; then
              echo "📦 Installing Docker on VPS..."
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker 2>/dev/null || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi

            # 4. Detect compose command
            if docker compose version &>/dev/null; then
              COMPOSE="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE="docker-compose"
            else
              echo "📦 Installing Docker compose plugin..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin 2>/dev/null || true
              COMPOSE="docker compose"
            fi

            # 5. Create production .env if not exists
            if [ ! -f .env ]; then
              echo "📝 Creating initial production .env..."
              cat << 'EOF' > .env
NODE_ENV=production
DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
IMAGE_TAG=latest
MONGO_ROOT_USER=admin
MONGO_ROOT_PASSWORD=columbu_secure_mongo_password_2024
MONGO_DB_NAME=columbu_stores
JWT_SECRET=columbu_super_secure_jwt_secret_change_in_prod_key
JWT_EXPIRE=7d
FRONTEND_URL=http://${{ secrets.HOST }}:90
EOF
            fi

            # 6. Pull and deploy
            echo "==> Pulling latest images..."
            $COMPOSE pull backend frontend || true

            echo "==> Restarting containers..."
            $COMPOSE up -d --remove-orphans

            echo "==> Container status:"
            $COMPOSE ps
