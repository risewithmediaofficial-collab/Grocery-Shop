# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — CI/CD Deployment Workflow
#  Packages source code -> SCP to VPS -> Docker Compose Build & Launch
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  #  Fast Direct VPS Deploy (Single Job)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Fast Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS SSH Secrets
        id: ssh_check
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS secrets detected. Proceeding with deployment."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOST and SSH_KEY secrets are not configured in GitHub repository settings. Skipping VPS deployment."
          fi

      - name: Package Application Code
        if: steps.ssh_check.outputs.can_deploy == 'true'
        run: |
          git archive --format=tar.gz -o app.tar.gz HEAD
          ls -lh app.tar.gz

      - name: Copy Deploy Bundle to VPS
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "app.tar.gz,docker-compose.prod.yml"
          target: "/tmp"
          overwrite: true

      - name: Deploy on VPS via SSH
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script_stop: false
          script: |
            # 1. Setup target directory (handles root or non-root user)
            TARGET_DIR="/opt/grocery-shop"

            # Ensure target directory exists and is writable by current user
            if command -v sudo &>/dev/null; then
              sudo mkdir -p "$TARGET_DIR" 2>/dev/null || true
              sudo chown -R "$USER:$USER" "$TARGET_DIR" 2>/dev/null || true
              sudo chmod -R u+rwX "$TARGET_DIR" 2>/dev/null || true
            else
              mkdir -p "$TARGET_DIR" 2>/dev/null || true
            fi

            # Fallback to home directory if /opt is not writable and sudo is unavailable
            if [ ! -w "$TARGET_DIR" ]; then
              echo "⚠️ $TARGET_DIR is not writable by $USER, falling back to $HOME/grocery-shop"
              TARGET_DIR="$HOME/grocery-shop"
              mkdir -p "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📂 Deploy directory: $(pwd)"

            # 2. Unpack application bundle and docker-compose
            if [ -f /tmp/app.tar.gz ]; then
              echo "📦 Unpacking application source code..."
              sudo chown -R "$USER:$USER" "$TARGET_DIR" 2>/dev/null || true
              sudo chmod -R u+rwX "$TARGET_DIR" 2>/dev/null || true

              if ! tar --no-same-owner --overwrite -xzf /tmp/app.tar.gz -C "$TARGET_DIR" 2>/tmp/tar_err.log; then
                echo "⚠️ Regular tar extraction had issue, attempting with sudo..."
                cat /tmp/tar_err.log 2>/dev/null || true
                sudo tar --no-same-owner --overwrite -xzf /tmp/app.tar.gz -C "$TARGET_DIR"
                sudo chown -R "$USER:$USER" "$TARGET_DIR" 2>/dev/null || true
              fi

              rm -f /tmp/app.tar.gz 2>/dev/null || sudo rm -f /tmp/app.tar.gz 2>/dev/null || true
              echo "✅ Application source code unpacked."
            fi

            if [ -f /tmp/docker-compose.prod.yml ]; then
              echo "📄 Updating docker-compose.yml..."
              cp -f /tmp/docker-compose.prod.yml ./docker-compose.yml 2>/dev/null || sudo cp -f /tmp/docker-compose.prod.yml ./docker-compose.yml 2>/dev/null || true
              sudo chown "$USER:$USER" ./docker-compose.yml 2>/dev/null || true
              rm -f /tmp/docker-compose.prod.yml 2>/dev/null || sudo rm -f /tmp/docker-compose.prod.yml 2>/dev/null || true
            fi

            # 3. Ensure Docker is installed
            if ! command -v docker &>/dev/null; then
              echo "📦 Installing Docker on VPS..."
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker 2>/dev/null || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi

            # 4. Detect compose command (supports sudo if docker daemon socket requires root)
            DOCKER_BIN="docker"
            if ! docker ps &>/dev/null; then
              if sudo docker ps &>/dev/null; then
                DOCKER_BIN="sudo docker"
                echo "ℹ️ Using sudo for Docker commands."
              fi
            fi

            if $DOCKER_BIN compose version &>/dev/null; then
              COMPOSE="$DOCKER_BIN compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE="docker-compose"
            elif sudo command -v docker-compose &>/dev/null; then
              COMPOSE="sudo docker-compose"
            else
              echo "📦 Installing Docker compose plugin..."
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin 2>/dev/null || true
              if $DOCKER_BIN compose version &>/dev/null; then
                COMPOSE="$DOCKER_BIN compose"
              else
                COMPOSE="sudo docker compose"
              fi
            fi
            echo "🚀 Using compose command: $COMPOSE"

            # 5. Create or fix production .env
            if [ ! -f .env ]; then
              echo "📝 Creating initial production .env..."
              printf "%s\n" \
                "NODE_ENV=production" \
                "DOCKER_USERNAME=grocery" \
                "IMAGE_TAG=latest" \
                "MONGO_ROOT_USER=admin" \
                "MONGO_ROOT_PASSWORD=columbu_secret_pwd" \
                "MONGO_DB_NAME=columbu_stores" \
                "JWT_SECRET=columbu_super_secure_jwt_secret_change_in_prod_key" \
                "JWT_EXPIRE=7d" \
                "FRONTEND_URL=http://${{ secrets.HOST }}:90" > .env
            else
              # Fix any legacy password mismatch in existing .env
              sed -i 's/columbu_secure_mongo_password_2024/columbu_secret_pwd/g' .env 2>/dev/null || true
            fi

            # 6. Build fresh containers from updated source code and launch
            echo "==> Building fresh containers from updated source code (no-cache)..."
            $COMPOSE build --no-cache
            echo "==> Starting updated containers..."
            $COMPOSE up -d --force-recreate --remove-orphans

            # 7. Ensure initial store seed data (admin, products, categories)
            echo "==> Ensuring initial database seed data..."
            sleep 10
            $COMPOSE exec -T backend node seed/seed.js || true

            echo "==> Container status:"
            $COMPOSE ps

