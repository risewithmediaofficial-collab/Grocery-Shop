# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — Simple CI/CD Deployment Workflow
#  Single-cluster deployment via Docker & SSH
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ─────────────────────────────────────────────
  #  1. Build & Push Docker Images
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Secrets
        id: docker_auth
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
            echo "repo=$DOCKER_USER" >> "$GITHUB_OUTPUT"
            echo "✅ Docker credentials detected. Images will be built and pushed to Docker Hub."
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "repo=grocery" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME and DOCKER_PASSWORD are not set in GitHub repository secrets. Images will be built to verify compilation, but will not be pushed."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_auth.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: |
            VITE_API_URL=/api
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  #  2. Deploy to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check VPS SSH Secrets
        id: ssh_check
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS secrets detected. Proceeding with deployment."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOST and SSH_KEY secrets are not configured in GitHub repository settings. Skipping VPS deployment."
          fi

      - name: Deploy on VPS via SSH
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/grocery-shop || cd ~/grocery-shop

            echo "==> Pulling latest images..."
            docker compose pull backend frontend

            echo "==> Restarting containers..."
            docker compose up -d --remove-orphans

            echo "==> Container status:"
            docker compose ps
