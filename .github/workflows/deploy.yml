# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — Simple CI/CD Deployment Workflow
#  Single-cluster deployment via Docker & SSH
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/grocery-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/grocery-frontend
  IMAGE_TAG: latest

jobs:
  # ─────────────────────────────────────────────
  #  1. Build & Push Docker Images
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  #  2. Deploy to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/grocery-shop || cd ~/grocery-shop

            echo "==> Pulling latest images..."
            docker compose pull backend frontend

            echo "==> Restarting containers..."
            docker compose up -d --remove-orphans

            echo "==> Container status:"
            docker compose ps
