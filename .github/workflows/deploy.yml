# ═══════════════════════════════════════════════════════════════════════════
#  Grocery Shop — CI/CD Deployment Workflow
#
#  Architecture:
#    GitHub → Build & push images to Docker Hub
#           → SSH into VPS → docker compose pull → docker compose up -d
#
#  The VPS never builds from source. Zero source code is copied to VPS.
# ═══════════════════════════════════════════════════════════════════════════

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Job 1 — Build Docker images and push to Docker Hub
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Hub Secrets
        id: docker_auth
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "has_auth=true"  >> "$GITHUB_OUTPUT"
            echo "repo=$DOCKER_USER" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "repo=grocery"   >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME / DOCKER_PASSWORD not set — images will build but not push."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_auth.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: VITE_API_URL=/api
          push: ${{ steps.docker_auth.outputs.has_auth == 'true' }}
          tags: ${{ steps.docker_auth.outputs.repo }}/grocery-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  #  Job 2 — Deploy: SSH → pull images from Docker Hub → compose up
  #
  #  ✅ No source code is copied to the VPS
  #  ✅ No SCP / git archive / tar steps
  #  ✅ docker-compose.yml is written inline over SSH
  #  ✅ VPS only needs: Docker + .env
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate VPS Secrets
        id: ssh_check
        env:
          HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOST / SSH_KEY secrets not set — skipping VPS deployment."
          fi

      - name: SSH → Pull images → Compose up
        if: steps.ssh_check.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script_stop: false
          script: |
            # ── 1. Working directory ───────────────────────────────────
            DIR="/opt/grocery-shop"
            mkdir -p "$DIR" 2>/dev/null || { DIR="$HOME/grocery-shop"; mkdir -p "$DIR"; }
            cd "$DIR"

            # ── 2. Ensure Docker is present ───────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker 2>/dev/null || true
            fi

            # ── 3. Pick compose command ────────────────────────────────
            if docker compose version &>/dev/null; then
              COMPOSE="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE="docker-compose"
            else
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin 2>/dev/null || true
              COMPOSE="docker compose"
            fi

            # ── 4. Write docker-compose.yml inline — no SCP needed ─────
            cat > docker-compose.yml << 'EOF'
            services:

              mongo:
                image: mongo:7-jammy
                container_name: grocery-mongo
                restart: unless-stopped
                environment:
                  MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
                  MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-columbu_secret_pwd}
                  MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-columbu_stores}
                volumes:
                  - mongo-data:/data/db
                networks:
                  - app-network
                healthcheck:
                  test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 10s

              backend:
                image: ${DOCKER_USERNAME:-grocery}/grocery-backend:${IMAGE_TAG:-latest}
                container_name: grocery-backend
                restart: unless-stopped
                environment:
                  NODE_ENV: production
                  PORT: 5000
                  MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-columbu_secret_pwd}@mongo:27017/${MONGO_DB_NAME:-columbu_stores}?authSource=admin
                  JWT_SECRET: ${JWT_SECRET:-grocery_super_secure_jwt_secret_change_in_prod}
                  JWT_EXPIRE: ${JWT_EXPIRE:-7d}
                  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
                depends_on:
                  mongo:
                    condition: service_healthy
                networks:
                  - app-network
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 30s

              frontend:
                image: ${DOCKER_USERNAME:-grocery}/grocery-frontend:${IMAGE_TAG:-latest}
                container_name: grocery-frontend
                restart: unless-stopped
                ports:
                  - "90:90"
                depends_on:
                  backend:
                    condition: service_healthy
                networks:
                  - app-network
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://localhost:90"]
                  interval: 15s
                  timeout: 5s
                  retries: 3
                  start_period: 10s

            networks:
              app-network:
                driver: bridge

            volumes:
              mongo-data:
                name: grocery_mongo_data
            EOF

            # ── 5. Bootstrap .env (only on first deploy) ───────────────
            if [ ! -f .env ]; then
              printf "%s\n" \
                "NODE_ENV=production" \
                "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" \
                "IMAGE_TAG=latest" \
                "MONGO_ROOT_USER=admin" \
                "MONGO_ROOT_PASSWORD=columbu_secret_pwd" \
                "MONGO_DB_NAME=columbu_stores" \
                "JWT_SECRET=columbu_super_secure_jwt_secret_change_in_prod_key" \
                "JWT_EXPIRE=7d" \
                "FRONTEND_URL=http://${{ secrets.HOST }}:90" > .env
            fi

            # ── 6. Pull latest images → restart containers ─────────────
            $COMPOSE pull --quiet
            $COMPOSE up -d --remove-orphans

            # 7. Wait for containers to be ready, then seed DB
            sleep 15
            $COMPOSE exec -T backend node seed/seed.js || true

            echo "==> Container status:"
            $COMPOSE ps
