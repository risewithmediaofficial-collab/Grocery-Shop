# ═══════════════════════════════════════════════════════════════════════
#  Grocery Shop — Production Single Cluster Docker Compose
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── MongoDB Database ────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: grocery-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-columbu_secret_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-columbu_stores}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend API (Express.js) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKER_USERNAME:-grocery}/grocery-backend:${IMAGE_TAG:-latest}
    container_name: grocery-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-columbu_secret_pwd}@mongo:27017/${MONGO_DB_NAME:-columbu_stores}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-grocery_super_secure_jwt_secret_change_in_prod}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Vite/React + Nginx API Proxy) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    image: ${DOCKER_USERNAME:-grocery}/grocery-frontend:${IMAGE_TAG:-latest}
    container_name: grocery-frontend
    restart: unless-stopped
    ports:
      - "90:90"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:90"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    name: grocery_mongo_data
